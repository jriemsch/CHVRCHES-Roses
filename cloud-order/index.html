<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Roses — cloud order</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #121212;
    --text: rgba(255, 255, 255, 0.9);
    --muted: rgba(255, 255, 255, 0.45);
    --accent: #c80018;
    --roses-icon-url: url("../assets/chvrches-roses-icon.svg");
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body * {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }
  .shell {
    width: min(100%, 520px);
    height: 100%;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0.75rem 1rem max(0.65rem, env(safe-area-inset-bottom, 0));
    gap: 0.55rem;
  }
  body.is-all-levels-preview .shell {
    height: 100%;
    max-height: 100dvh;
  }
  body.is-all-levels-preview .assembly-strip {
    max-height: 10vh;
    min-height: 2.25rem;
  }
  body.is-all-levels-preview .cloud-wrap {
    flex: 1;
    min-height: 0;
  }
  body.is-all-levels-preview .cloud-stage {
    flex: 1;
    min-height: 0;
    height: auto;
  }
  .play-hud {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.65rem 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    padding-bottom: 0.45rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .play-hud strong {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .play-hud .countdown strong {
    color: var(--accent);
    font-size: 1rem;
  }
  .play-hud-spacer {
    flex: 1;
    min-width: 0.35rem;
  }
  .reset-labeled-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.1rem 0.2rem 0.1rem 0;
    margin: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    color: inherit;
    font: inherit;
    flex-shrink: 0;
  }
  .cross-icon-wrap {
    width: 2.1rem;
    height: 2.1rem;
    min-width: 2.1rem;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .cross-glyph {
    width: 58%;
    height: 58%;
    display: block;
    pointer-events: none;
    image-rendering: pixelated;
  }
  .reset-label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .assembly-strip {
    flex-shrink: 0;
    min-height: 4.5rem;
    max-height: 28vh;
    overflow-y: auto;
    padding: 0.55rem 0.65rem;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.08);
    -webkit-overflow-scrolling: touch;
  }
  .assembly-lines {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .assembly-line {
    text-transform: uppercase;
    font-size: 0.78rem;
    line-height: 1.4;
    color: var(--text);
    min-height: 1.4em;
  }
  .assembly-line.is-empty {
    color: transparent;
    user-select: none;
  }
  .assembly-line.is-reveal-pop {
    animation: assembly-line-pop 0.38s cubic-bezier(0.22, 0.85, 0.32, 1);
  }
  @keyframes assembly-line-pop {
    0% {
      opacity: 0.35;
      transform: scale(0.9);
    }
    55% {
      opacity: 1;
      transform: scale(1.04);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }
  body.is-play-game .assembly-strip {
    overflow-y: hidden;
    min-height: calc(3 * 1.4em + 2 * 0.15rem + 1.1rem);
    max-height: calc(3 * 1.4em + 2 * 0.15rem + 1.1rem);
  }
  .cloud-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .cloud-stage {
    position: relative;
    flex: 1;
    min-height: 12rem;
    border-radius: 14px;
    border: 1px solid rgba(200, 0, 24, 0.35);
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(200, 0, 24, 0.06), transparent 70%),
      var(--panel);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #parts-root {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .cloud-draw-layer {
    position: absolute;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    overflow: visible;
  }
  .cloud-draw-layer .lyric-part-anchor.is-fly-overlay {
    z-index: 10;
  }
  #path-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
  }
  .lyric-part-anchor {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.48s ease, transform 0.48s ease;
  }
  body.is-play-game .lyric-part-anchor:not(.is-fly-overlay) {
    pointer-events: auto;
    cursor: pointer;
    touch-action: manipulation;
  }
  .lyric-part-anchor.is-fly-overlay.is-flying-to-assembly {
    opacity: 1;
    transform: translate3d(var(--fly-dx, 0px), var(--fly-dy, 0px), 0) scale(0.94);
    transition: transform 0.52s cubic-bezier(0.22, 0.85, 0.32, 1), opacity 0.52s ease;
    will-change: transform, opacity;
  }
  .lyric-part-anchor.is-fly-overlay.is-flying-to-assembly.is-fly-run {
    opacity: 0;
  }
  .lyric-part-anchor.is-tap-marked .lyric-block {
    box-shadow: inset 0 0 0 9999px rgba(220, 72, 68, 0.14);
  }
  .lyric-part-anchor.is-picked-wrong {
    opacity: 0;
    transform: scale(0.92);
  }
  .lyric-part-anchor.is-spawn-in {
    opacity: 0;
    transform: scale(0.92);
  }
  .lyric-part-anchor.is-spawn-in.is-spawn-visible {
    opacity: 1;
    transform: scale(1);
  }
  .lyric-part-anchor.is-fly-overlay {
    position: fixed;
    margin: 0;
  }
  .cloud-stage.is-drawing {
    cursor: none;
  }
  .lyric-block {
    position: relative;
    background: #000000;
  }
  .lyric-block.is-tight {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .lyric-grid {
    display: grid;
    gap: 0;
    margin: 0;
    font-family: "SF Mono", ui-monospace, Menlo, Monaco, "Courier New", monospace;
    font-weight: 500;
    line-height: 1;
    user-select: none;
    letter-spacing: 0;
  }
  .grid-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  }
  .grid-cell.is-pad {
    color: transparent;
    text-shadow: none;
  }
  .grid-cell.has-cross .cross-glyph {
    width: 48%;
    height: 48%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    opacity: 0.92;
    filter: brightness(2.4) grayscale(1) drop-shadow(0 0 6px rgba(255, 255, 255, 0.22));
  }
  .rose-handle {
    position: absolute;
    z-index: 51;
    width: 2.35rem;
    height: 2.35rem;
    margin: -1.175rem 0 0 -1.175rem;
    border-radius: 50%;
    border: 1px solid rgba(200, 0, 24, 0.5);
    background: rgba(200, 0, 24, 0.18);
    box-shadow: 0 0 16px rgba(255, 0, 0, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .rose-handle .rose-glyph {
    width: 62%;
    height: 62%;
    display: block;
    background-color: rgba(255, 255, 255, 0.92);
    -webkit-mask: var(--roses-icon-url) center / contain no-repeat;
    mask: var(--roses-icon-url) center / contain no-repeat;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2));
  }
</style>
</head>

        <div class="rose-handle" id="rose-handle" aria-hidden="true">

        </div>

</div>

    const cell = Math.min(inner / cols, inner / rows);
    return Math.max(10, cell * LYRIC_PART_SCALE);
  }

  function lineBoxMetrics(text, frameW, frameH, fixedCellPx = null, gameLevel = 1) {
    const grid = buildLineGrid(text, gameLevel);
    const cellPx =
      fixedCellPx != null
        ? fixedCellPx
        : cellPxForSquareGrid(
            grid.rows,
            grid.cols,
            squareSideForFrame(frameW, frameH)
          );
    const gridW = cellPx * grid.cols;
    const gridH = cellPx * grid.rows;
    const blockW = gridW + BOX_PAD_PX * 2;
    const blockH = gridH + BOX_PAD_PX * 2;
    return { ...grid, cellPx, gridW, gridH, blockW, blockH };
  }

  /** Letter scale for split levels matches the full-line (level 1) box for that lyric line. */
  function referenceCellPxForLine(lineEntry, frameW, frameH) {
    return lineBoxMetrics(lineEntry.full, frameW, frameH).cellPx;
  }

  /** Smallest cell px so every cloud string fits inside `CLOUD_MAX_BLOCK_SIDE_FRACTION`. */
  function cloudReferenceCellPx(texts, frameW, frameH, gameLevel = 1) {
    const maxSide = Math.min(frameW, frameH) * CLOUD_MAX_BLOCK_SIDE_FRACTION;
    const inner = Math.max(24, maxSide - BOX_PAD_PX * 2);
    let cellPx = Infinity;
    for (const text of texts) {
      const grid = buildLineGrid(text, gameLevel);
      const cap = Math.min(inner / grid.cols, inner / grid.rows);
      cellPx = Math.min(cellPx, Math.max(6, cap * CLOUD_LYRIC_PART_SCALE));
    }
    return cellPx === Infinity ? 8 : cellPx;
  }

  function shuffleIndices(n, seed) {
    const order = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = (seed + i * 7919) % (i + 1);
      const tmp = order[i];
      order[i] = order[j];
      order[j] = tmp;
    }
    return order;
  }

  function cloudRandFactory(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Seeded random non-overlapping positions (largest boxes placed first). */
  function layoutCloudRandomSlots(boxes, frameW, frameH, pad, gap, seedBase) {
    const n = boxes.length;
    const indices = Array.from({ length: n }, (_, i) => i);
    indices.sort((a, b) => boxes[b].blockW * boxes[b].blockH - boxes[a].blockW * boxes[a].blockH);
    const slots = new Array(n);
    const placed = [];

    for (const bi of indices) {
      const box = boxes[bi];
      const maxLeft = frameW - pad - box.blockW;
      const maxTop = frameH - pad - box.blockH;
      if (maxLeft < pad || maxTop < pad) {
        return { slots: null, fits: false };
      }
      const rng = cloudRandFactory(seedBase + bi * 1009);
      let found = false;
      for (let attempt = 0; attempt < CLOUD_PLACE_ATTEMPTS; attempt++) {
        const left = pad + rng() * (maxLeft - pad);
        const top = pad + rng() * (maxTop - pad);
        const candidate = { left, top, blockW: box.blockW, blockH: box.blockH };
        let ok = true;
        for (const p of placed) {
          if (rectsOverlap(candidate, p, gap)) {
            ok = false;
            break;
          }
        }
        if (ok) {
          slots[bi] = candidate;
          placed.push(candidate);
          found = true;
          break;
        }
      }
      if (!found) {
        return { slots: null, fits: false };
      }
    }
    return { slots, fits: true };
  }

  function measureLyricLineBox(text, frameW, frameH, fixedCellPx, gameLevel = 1) {
    const { blockW, blockH } = lineBoxMetrics(text, frameW, frameH, fixedCellPx, gameLevel);
    return { blockW, blockH };
  }

  function buildLyricPartBlock(
    text,
    frameW,
    frameH,
    left,
    top,
    fixedCellPx,
    gameLevel = 1,
    partMeta = null
  ) {
    const { chars, rows, cols, cellPx, gridW, gridH, blockW, blockH } = lineBoxMetrics(
      text,
      frameW,
      frameH,
      fixedCellPx,
      gameLevel
    );
    const anchor = document.createElement("div");
    anchor.className = "lyric-part-anchor";
    anchor.style.left = `${left}px`;
    anchor.style.top = `${top}px`;
    if (partMeta) {
      anchor.dataset.lineIndex = String(partMeta.lineIndex);
      anchor.dataset.partIndex = String(partMeta.partIndex);
      anchor.dataset.isTarget = partMeta.isTarget ? "1" : "0";
      anchor.dataset.textKey = partMeta.textKey || text;
    }

    const wrap = document.createElement("div");
    wrap.className = "lyric-block is-tight";
    wrap.style.width = `${blockW}px`;
    wrap.style.height = `${blockH}px`;

    const gridEl = document.createElement("div");
    gridEl.className = "lyric-grid";
    gridEl.style.width = `${gridW}px`;
    gridEl.style.height = `${gridH}px`;
    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    gridEl.style.fontSize = `${fontPxForGrid(rows, cols, cellPx)}px`;

    for (let i = 0; i < chars.length; i++) {
      const r = Math.floor(i / cols);
      const c = i % cols;
      const el = document.createElement("span");
      el.className = "grid-cell";
      const shown = displayChar(chars[i]);
      const isPad = shown === " " && chars[i] === " ";
      if (isPad) {
        el.classList.add("is-pad", "has-cross");
        const img = document.createElement("img");
        img.className = "cross-glyph";
        img.src = crossSrcForCell(r + c + i);
        img.alt = "";
        img.decoding = "async";
        el.appendChild(img);
      } else {
        el.textContent = shown;
      }
      gridEl.appendChild(el);
    }

    wrap.appendChild(gridEl);
    anchor.appendChild(wrap);
    return { anchor, blockW, blockH, left, top };
  }

  /** @type {{ anchor: HTMLElement, blockW: number, blockH: number, left: number, top: number, isTarget: boolean, lineIndex: number, partIndex: number, text: string }[]} */
  let cloudParts = [];
  let cloudRefCellPx = 12;

  function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function sortedPlayableEntries() {
    return [...LINE_BOX_HIERARCHY].sort((a, b) => a.lineIndex - b.lineIndex);
  }

  function partTextForEntry(entry, partIdx = 0) {
    const parts = partsForEntry(entry);
    return parts[partIdx] ?? parts[0] ?? "";
  }

  function placementForEntry(entry, isTarget, partIdx = 0) {
    const text = partTextForEntry(entry, partIdx);
    return {
      text,
      lineIndex: entry.lineIndex,
      partIndex: partIdx,
      isTarget: !!isTarget,
      textKey: `${isTarget ? "target" : "decoy"}:${entry.lineIndex}:${partIdx}:${text}`,
    };
  }

  /** Lyric lines after the current expected index (song order). */
  function upcomingEntries() {
    const sorted = sortedPlayableEntries();
    return sorted.slice(gameExpectedLineIndex + 1);
  }

  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pickFarDecoyEntries(correctText, usedTexts, count) {
    const sorted = sortedPlayableEntries();
    const pool = [];
    for (let i = 0; i < gameExpectedLineIndex; i++) {
      const entry = sorted[i];
      if (!entry) continue;
      const text = partTextForEntry(entry);
      if (!text || text === correctText || usedTexts.has(text)) continue;
      pool.push(entry);
    }
    shuffleInPlace(pool);
    return pool.slice(0, count);
  }

  /** Furthest lyric line index kept in the sliding cloud window (four boxes → expected + 3 ahead). */
  function cloudLookaheadTailLineIndex() {
    return entryAtPlayIndex(gameExpectedLineIndex + cloudMaxBoxes() - 1).lineIndex;
  }

  /** Initial decoys: the next `count` lyric lines in song order (lookahead window). */
  function pickInitialCloudDecoys(correctText, count) {
    const used = new Set([correctText]);
    const out = [];
    for (let d = 1; d <= count; d++) {
      const entry = entryAtPlayIndex(gameExpectedLineIndex + d);
      if (!entry) continue;
      const text = partTextForEntry(entry);
      if (!text || used.has(text)) continue;
      used.add(text);
      out.push({ text, lineIndex: entry.lineIndex, partIndex: 0 });
    }
    for (const entry of pickFarDecoyEntries(correctText, used, count - out.length)) {
      const text = partTextForEntry(entry);
      if (used.has(text)) continue;
      used.add(text);
      out.push({ text, lineIndex: entry.lineIndex, partIndex: 0 });
    }
    return out;
  }

  function pickDecoyTexts(correctText, count) {
    return pickInitialCloudDecoys(correctText, count);
  }

  function textsOnCloud(excludeAnchor = null) {
    const used = new Set();
    for (const p of cloudParts) {
      if (excludeAnchor && p.anchor === excludeAnchor) continue;
      used.add(p.text);
    }
    return used;
  }

  function replaceCloudPartContent(part, placement) {
    const frameW = stage.clientWidth;
    const frameH = stage.clientHeight;
    const { left, top } = part;
    const meta = {
      lineIndex: placement.lineIndex,
      partIndex: placement.partIndex ?? 0,
      isTarget: placement.isTarget,
      textKey: placement.textKey,
    };
    const { anchor, blockW, blockH } = buildLyricPartBlock(
      placement.text,
      frameW,
      frameH,
      left,
      top,
      cloudRefCellPx,
      ACTIVE_GAME_LEVEL,
      meta
    );
    part.anchor.remove();
    cloudParts = cloudParts.filter((p) => p.anchor !== part.anchor);
    partsRoot.appendChild(anchor);
    registerCloudPart(anchor, blockW, blockH, left, top, placement);
  }

  /** If the expected line is missing after a pick, retarget the furthest decoy in place (no fade-in). */
  function ensureExpectedOnCloud() {
    const expected = expectedPartText();
    if (!expected) return;
    if (textsOnCloud(null).has(expected)) return;
    const decoys = cloudParts.filter((p) => p.text !== expected);
    if (!decoys.length) return;
    let furthest = decoys[0];
    for (const p of decoys) {
      if (p.lineIndex > furthest.lineIndex) furthest = p;
    }
    const placement = targetPlacementForActiveLine();
    placement.isTarget = false;
    placement.textKey = `decoy:${expected}`;
    replaceCloudPartContent(furthest, placement);
  }

  /**
   * One replacement after a removal. Never spawns the current target (that reads as “the new box”).
   * Extends the sliding window by placing the tail line (expected + maxBoxes − 1) when possible.
   */
  function pickLookaheadTailReplacement(excludeAnchor) {
    const expected = expectedPartText();
    const used = textsOnCloud(excludeAnchor);
    const tryEntry = (entry) => {
      if (!entry) return null;
      const text = partTextForEntry(entry);
      if (!text || used.has(text) || text === expected) return null;
      return placementForEntry(entry, false);
    };

    const tailIdx = cloudLookaheadTailLineIndex();
    const tailEntry = sortedPlayableEntries().find((e) => e.lineIndex === tailIdx);
    const tailPlacement = tryEntry(tailEntry);
    if (tailPlacement) return tailPlacement;

    let farthest = null;
    for (const entry of upcomingEntries()) {
      const text = partTextForEntry(entry);
      if (!text || used.has(text) || text === expected) continue;
      if (!farthest || entry.lineIndex > farthest.lineIndex) farthest = entry;
    }
    if (farthest) return placementForEntry(farthest, false);

    for (const entry of pickFarDecoyEntries(expected, used, 8)) {
      const placement = tryEntry(entry);
      if (placement) return placement;
    }
    return null;
  }

  function pickCloudPoolReplacement(excludeAnchor) {
    return pickLookaheadTailReplacement(excludeAnchor);
  }

  function pickDecoyReplacementText(excludeAnchor) {
    return pickLookaheadTailReplacement(excludeAnchor);
  }

  function targetPlacementForActiveLine() {
    const lineEntry = activeLineEntry();
    const text = expectedPartText();
    return {
      text,
      lineIndex: lineEntry.lineIndex,
      partIndex: gameExpectedPartIndex,
      isTarget: true,
      textKey: `target:${lineEntry.lineIndex}:${gameExpectedPartIndex}:${text}`,
    };
  }

  function dedupePlacementsByText(placements) {
    const seen = new Set();
    const out = [];
    for (const p of placements) {
      const key = p.meta?.textKey ?? p.text;
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(p);
    }
    return out;
  }

  function currentLinePartKeysOnCloud() {
    const entry = activeLineEntry();
    const keys = new Set();
    for (const p of cloudParts) {
      if (p.lineIndex === entry.lineIndex) keys.add(p.partIndex);
    }
    return keys;
  }

  /** Re-place missing phrase boxes still needed for the active line (levels > 1). */
  function ensureCurrentLinePartsOnCloud() {
    if (!lineUsesMultiPartPlay()) return;
    const entry = activeLineEntry();
    const parts = partsForEntry(entry);
    if (parts.length <= 1) return;
    const onCloud = currentLinePartKeysOnCloud();
    for (let pi = 0; pi < parts.length; pi++) {
      if (pi < gameExpectedPartIndex) continue;
      const text = parts[pi];
      if (!text || onCloud.has(pi)) continue;
      if (!canSpawnCloudReplacement()) break;
      const pos = randomPositionForNewBlock(
        text,
        `repl-line-part:${entry.lineIndex}:${pi}:${cloudParts.length}`
      );
      if (!pos) break;
      fadeInCloudReplacement(pos.left, pos.top, {
        text,
        lineIndex: entry.lineIndex,
        partIndex: pi,
        isTarget: pi === gameExpectedPartIndex,
        textKey: `line:${entry.lineIndex}:${pi}`,
      });
      onCloud.add(pi);
    }
  }

  function randomAmbientDelayMs() {
    return (
      DECOY_AMBIENT_MIN_MS +
      Math.random() * (DECOY_AMBIENT_MAX_MS - DECOY_AMBIENT_MIN_MS)
    );
  }

  function stopAmbientDecoyRotation() {
    if (ambientDecoyTimerId) {
      window.clearTimeout(ambientDecoyTimerId);
      ambientDecoyTimerId = null;
    }
  }

  /** Next lyric line in song order — keep on field if already shown (ambient tick must not yank it). */
  function nextUpcomingLineIndex() {
    return entryAtPlayIndex(gameExpectedLineIndex + 1).lineIndex;
  }

  function isProtectedFromAmbientRemoval(part) {
    const currentLine = activeLineEntry().lineIndex;
    const nextLine = nextUpcomingLineIndex();
    if (lineUsesMultiPartPlay()) {
      if (part.lineIndex === currentLine) return true;
      return part.lineIndex === nextLine;
    }
    return part.lineIndex === nextLine;
  }

  function ambientDecoyCandidates() {
    const expected = expectedPartText();
    return cloudParts.filter(
      (p) => p.text !== expected && !isProtectedFromAmbientRemoval(p)
    );
  }

  function scheduleNextAmbientDecoyTick() {
    stopAmbientDecoyRotation();
    if (!PLAY_GAME || ALL_LEVELS_PREVIEW) return;
    if (!ambientDecoyCandidates().length) return;
    ambientDecoyTimerId = window.setTimeout(() => {
      ambientDecoyTimerId = null;
      onAmbientDecoyTick();
    }, randomAmbientDelayMs());
  }

  function ensureAmbientDecoyRotation() {
    if (!PLAY_GAME || ALL_LEVELS_PREVIEW || !ambientDecoyCandidates().length) {
      stopAmbientDecoyRotation();
      return;
    }
    if (!ambientDecoyTimerId) scheduleNextAmbientDecoyTick();
  }

  function onAmbientDecoyTick() {
    if (!PLAY_GAME || ALL_LEVELS_PREVIEW) return;
    if (pickLocked || ambientDecoyCycleBusy) {
      scheduleNextAmbientDecoyTick();
      return;
    }
    const candidates = ambientDecoyCandidates();
    if (!candidates.length) {
      stopAmbientDecoyRotation();
      return;
    }
    ambientDecoyCycleBusy = true;
    const part = candidates[Math.floor(Math.random() * candidates.length)];
    part.anchor.classList.add("is-picked-wrong");
    window.setTimeout(() => {
      if (cloudParts.includes(part)) finishPickRemoval(part);
      spawnCloudReplacementDecoy("ambient");
      topUpCloudToMaxBoxes();
      ambientDecoyCycleBusy = false;
      scheduleNextAmbientDecoyTick();
    }, PICK_FADE_MS);
  }

  function registerCloudPart(anchor, bw, bh, left, top, placement) {
    const part = {
      anchor,
      blockW: bw,
      blockH: bh,
      left,
      top,
      isTarget: placement.isTarget,
      lineIndex: placement.lineIndex,
      partIndex: placement.partIndex ?? 0,
      text: placement.text,
    };
    cloudParts.push(part);
    ensureAmbientDecoyRotation();
    return part;
  }

  function fadeInCloudReplacement(left, top, placement) {
    const frameW = stage.clientWidth;
    const frameH = stage.clientHeight;
    const meta = {
      lineIndex: placement.lineIndex,
      partIndex: placement.partIndex ?? 0,
      isTarget: placement.isTarget,
      textKey: placement.textKey,
    };
    const { anchor, blockW, blockH } = buildLyricPartBlock(
      placement.text,
      frameW,
      frameH,
      left,
      top,
      cloudRefCellPx,
      ACTIVE_GAME_LEVEL,
      meta
    );
    anchor.classList.add("is-spawn-in");
    partsRoot.appendChild(anchor);
    registerCloudPart(anchor, blockW, blockH, left, top, placement);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => anchor.classList.add("is-spawn-visible"));
    });
  }

  function finishPickRemoval(part) {
    clearPartTapMark(part);
    part.anchor.remove();
    cloudParts = cloudParts.filter((p) => p.anchor !== part.anchor);
  }

  function cloudPlacementRects(excludeAnchor = null) {
    return cloudParts
      .filter((p) => !excludeAnchor || p.anchor !== excludeAnchor)
      .map((p) => ({
        left: p.left,
        top: p.top,
        blockW: p.blockW,
        blockH: p.blockH,
      }));
  }

  function positionFitsCloud(candidate, placed, gap) {
    for (const p of placed) {
      if (rectsOverlap(candidate, p, gap)) return false;
    }
    return true;
  }

  function findCloudPositionForBlock(blockW, blockH, seedKey, excludeAnchor = null) {
    const frameW = stage.clientWidth;
    const frameH = stage.clientHeight;
    const pad = CLOUD_LAYOUT_PAD;
    const gap = CLOUD_LAYOUT_GAP;
    const maxLeft = frameW - pad - blockW;
    const maxTop = frameH - pad - blockH;
    if (maxLeft < pad || maxTop < pad) return null;
    const placed = cloudPlacementRects(excludeAnchor);
    const seedBase = hashSeed(seedKey);
    for (let attempt = 0; attempt < CLOUD_PLACE_ATTEMPTS; attempt++) {
      const rng = cloudRandFactory(seedBase + attempt * 131);
      const candidate = {
        left: pad + rng() * (maxLeft - pad),
        top: pad + rng() * (maxTop - pad),
        blockW,
        blockH,
      };
      if (positionFitsCloud(candidate, placed, gap)) {
        return { left: candidate.left, top: candidate.top };
      }
    }
    const stepX = Math.max(6, Math.floor((blockW + gap) / 3));
    const stepY = Math.max(6, Math.floor((blockH + gap) / 3));
    for (let top = pad; top <= maxTop; top += stepY) {
      for (let left = pad; left <= maxLeft; left += stepX) {
        const candidate = { left, top, blockW, blockH };
        if (positionFitsCloud(candidate, placed, gap)) {
          return { left, top };
        }
      }
    }
    return null;
  }

  function randomPositionForNewBlock(text, seedKey, excludeAnchor = null) {
    const frameW = stage.clientWidth;
    const frameH = stage.clientHeight;
    const { blockW, blockH } = measureLyricLineBox(
      text,
      frameW,
      frameH,
      cloudRefCellPx,
      ACTIVE_GAME_LEVEL
    );
    return findCloudPositionForBlock(blockW, blockH, seedKey, excludeAnchor);
  }

  function rectsOverlap(a, b, gap) {
    return !(
      a.left + a.blockW + gap <= b.left ||
      b.left + b.blockW + gap <= a.left ||
      a.top + a.blockH + gap <= b.top ||
      b.top + b.blockH + gap <= a.top
    );
  }

  function layoutCloudPlayfield(frameW, frameH) {
    stopAmbientDecoyRotation();
    ambientDecoyCycleBusy = false;
    cloudParts = [];
    const lineEntry = activeLineEntry();
    const parts = partsForEntry(lineEntry);
    const pad = CLOUD_LAYOUT_PAD;
    const gap = CLOUD_LAYOUT_GAP;
    const placements = [];

    if (lineUsesMultiPartPlay() && parts.length > 1) {
      for (let pi = 0; pi < parts.length; pi++) {
        placements.push({
          text: parts[pi],
          meta: {
            lineIndex: lineEntry.lineIndex,
            partIndex: pi,
            isTarget: pi === gameExpectedPartIndex,
            textKey: `line:${lineEntry.lineIndex}:${pi}`,
          },
          isTarget: pi === gameExpectedPartIndex,
        });
      }
      const decoySlots = Math.max(0, cloudMaxBoxes() - placements.length);
      for (const decoy of pickDecoyTexts(expectedPartText(), decoySlots)) {
        placements.push({
          text: decoy.text,
          meta: {
            lineIndex: decoy.lineIndex,
            partIndex: decoy.partIndex,
            isTarget: false,
            textKey: `decoy:${decoy.lineIndex}:${decoy.partIndex}:${decoy.text}`,
          },
          isTarget: false,
        });
      }
    } else {
      const targetMeta = {
        lineIndex: lineEntry.lineIndex,
        partIndex: 0,
        isTarget: true,
        textKey: `target:${lineEntry.lineIndex}:0`,
      };
      placements.push({
        text: parts[0],
        meta: targetMeta,
        isTarget: true,
      });
      for (const decoy of pickDecoyTexts(parts[0], initialCloudDecoyCount())) {
      placements.push({
        text: decoy.text,
        meta: {
          lineIndex: decoy.lineIndex,
          partIndex: decoy.partIndex,
          isTarget: false,
          textKey: `decoy:${decoy.text}`,
        },
        isTarget: false,
      });
      }
    }
    const uniquePlacements = dedupePlacementsByText(placements);

    const allTexts = uniquePlacements.map((p) => p.text);
    let refCellPx = cloudReferenceCellPx(allTexts, frameW, frameH, ACTIVE_GAME_LEVEL);
    let boxes = uniquePlacements.map((p) =>
      measureLyricLineBox(p.text, frameW, frameH, refCellPx, ACTIVE_GAME_LEVEL)
    );
    const seedBase = hashSeed(`cloud:${gameExpectedLineIndex}`);
    let randomLayout = layoutCloudRandomSlots(boxes, frameW, frameH, pad, gap, seedBase);
    for (let shrink = 0; shrink < 14 && !randomLayout.fits; shrink++) {
      refCellPx *= 0.91;
      boxes = uniquePlacements.map((p) =>
        measureLyricLineBox(p.text, frameW, frameH, refCellPx, ACTIVE_GAME_LEVEL)
      );
      randomLayout = layoutCloudRandomSlots(boxes, frameW, frameH, pad, gap, seedBase + shrink * 17);
    }
    const slots = randomLayout.slots || [];
    cloudRefCellPx = refCellPx;

    for (let i = 0; i < uniquePlacements.length; i++) {
      const slot = slots[i];
      if (!slot) continue;
      const left = slot.left;
      const top = slot.top;
      const { anchor, blockW: bw, blockH: bh } = buildLyricPartBlock(
        uniquePlacements[i].text,
        frameW,
        frameH,
        left,
        top,
        refCellPx,
        ACTIVE_GAME_LEVEL,
        uniquePlacements[i].meta
      );
      partsRoot.appendChild(anchor);
      registerCloudPart(anchor, bw, bh, left, top, {
        text: uniquePlacements[i].text,
        isTarget: uniquePlacements[i].isTarget,
        lineIndex: uniquePlacements[i].meta.lineIndex,
        partIndex: uniquePlacements[i].meta.partIndex ?? 0,
      });
    }

    ensureAmbientDecoyRotation();
    return {
      left: frameW * 0.5,
      top: frameH * 0.78,
      blockW: 0,
      blockH: 0,
    };
  }

  function choosePartsGridCols(boxes, gap) {
    const n = boxes.length;
    if (n <= 1) return 1;
    let bestCols = 1;
    let bestScore = Infinity;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      let maxRowW = 0;
      let totalH = 0;
      for (let r = 0; r < rows; r++) {
        let rowW = 0;
        let rowH = 0;
        let placed = 0;
        for (let c = 0; c < cols; c++) {
          const i = r * cols + c;
          if (i >= n) break;
          if (placed > 0) rowW += gap;
          rowW += boxes[i].blockW;
          rowH = Math.max(rowH, boxes[i].blockH);
          placed++;
        }
        maxRowW = Math.max(maxRowW, rowW);
        totalH += rowH + (r > 0 ? gap : 0);
      }
      const aspect = maxRowW / Math.max(totalH, 1);
      const score = Math.abs(aspect - 1) + (cols === n ? 0.02 : 0);
      if (score < bestScore || (score === bestScore && cols < bestCols)) {
        bestScore = score;
        bestCols = cols;
      }
    }
    return bestCols;
  }

  function levelKeysForLine(lineEntry) {
    return Object.keys(lineEntry.levels)
      .map(Number)
      .filter((k) => lineEntry.levels[k]?.length)
      .sort((a, b) => a - b);
  }

  function measureLevelRow(parts, frameW, frameH, cellPx, gap, gameLevel) {
    const boxes = parts.map((text) =>
      measureLyricLineBox(text, frameW, frameH, cellPx, gameLevel)
    );
    let rowW = 0;
    let rowH = 0;
    for (let i = 0; i < boxes.length; i++) {
      if (i > 0) rowW += gap;
      rowW += boxes[i].blockW;
      rowH = Math.max(rowH, boxes[i].blockH);
    }
    return { parts, boxes, rowW, rowH };
  }

  function measureAllLevelsStack(lineEntry, frameW, frameH, cellPx, partGap, levelGap) {
    const levels = levelKeysForLine(lineEntry);
    const rows = levels.map((lv) =>
      measureLevelRow(lineEntry.levels[lv], frameW, frameH, cellPx, partGap, lv)
    );
    let totalH = 0;
    let maxW = 0;
    for (let i = 0; i < rows.length; i++) {
      maxW = Math.max(maxW, rows[i].rowW);
      totalH += rows[i].rowH + (i > 0 ? levelGap : 0);
    }
    return { levels, rows, totalH, maxW };
  }

  function layoutSingleLevel(parts, frameW, frameH, refCellPx, gap, gameLevel) {
    const boxes = parts.map((text) =>
      measureLyricLineBox(text, frameW, frameH, refCellPx, gameLevel)
    );
    const n = parts.length;
    const gridCols = choosePartsGridCols(boxes, gap);
    const gridRows = Math.ceil(n / gridCols);
    const rowMetrics = [];
    for (let r = 0; r < gridRows; r++) {
      let rowW = 0;
      let rowH = 0;
      const indices = [];
      for (let c = 0; c < gridCols; c++) {
        const i = r * gridCols + c;
        if (i >= n) break;
        if (indices.length > 0) rowW += gap;
        indices.push(i);
        rowW += boxes[i].blockW;
        rowH = Math.max(rowH, boxes[i].blockH);
      }
      rowMetrics.push({ rowW, rowH, indices });
    }
    const totalW = Math.max(...rowMetrics.map((m) => m.rowW), 0);
    const totalH = rowMetrics.reduce((sum, m, ri) => sum + m.rowH + (ri > 0 ? gap : 0), 0);
    const baseX = (frameW - totalW) / 2;
    let y = (frameH - totalH) / 2;
    let lastAnchor = null;
    for (const { rowW, rowH, indices } of rowMetrics) {
      let x = baseX + (totalW - rowW) / 2;
      for (const i of indices) {
        const partTop = y + (rowH - boxes[i].blockH) / 2;
        const { anchor, blockW, blockH } = buildLyricPartBlock(
          parts[i],
          frameW,
          frameH,
          x,
          partTop,
          refCellPx,
          gameLevel
        );
        partsRoot.appendChild(anchor);
        lastAnchor = { anchor, blockW, blockH, left: x, top: partTop };
        x += blockW + gap;
      }
      y += rowH + gap;
    }
    return lastAnchor;
  }

  function layoutAllLevelsPreview(frameW, frameH) {
    const basePartGap = 10;
    const baseLevelGap = 14;
    const pad = 14;
    const lineEntry = activeLineEntry();
    const refCellPx = referenceCellPxForLine(lineEntry, frameW, frameH);
    const availW = frameW - pad * 2;
    const availH = frameH - pad * 2;
    let cellPx = refCellPx;
    let partGap = basePartGap;
    let levelGap = baseLevelGap;
    let stack = measureAllLevelsStack(
      lineEntry,
      frameW,
      frameH,
      cellPx,
      partGap,
      levelGap
    );
    for (let pass = 0; pass < 32; pass++) {
      if (stack.maxW <= availW && stack.totalH <= availH) break;
      const scale = Math.min(availW / stack.maxW, availH / stack.totalH);
      cellPx = Math.max(4, cellPx * scale * 0.9);
      const gapRatio = cellPx / refCellPx;
      partGap = Math.max(2, basePartGap * gapRatio);
      levelGap = Math.max(3, baseLevelGap * gapRatio);
      stack = measureAllLevelsStack(
        lineEntry,
        frameW,
        frameH,
        cellPx,
        partGap,
        levelGap
      );
    }
    const totalW = stack.maxW;
    const totalH = stack.totalH;
    const baseX = (frameW - totalW) / 2;
    let y = (frameH - totalH) / 2;
    for (let ri = 0; ri < stack.rows.length; ri++) {
      const { parts, boxes, rowW, rowH } = stack.rows[ri];
      const gameLevel = stack.levels[ri];
      let x = baseX + (totalW - rowW) / 2;
      for (let i = 0; i < parts.length; i++) {
        const partTop = y + (rowH - boxes[i].blockH) / 2;
        const { anchor } = buildLyricPartBlock(
          parts[i],
          frameW,
          frameH,
          x,
          partTop,
          cellPx,
          gameLevel
        );
        partsRoot.appendChild(anchor);
        x += boxes[i].blockW + partGap;
      }
      y += rowH + levelGap;
    }
    return null;
  }

  let pathPoints = [];
  /** Only path from this index counts toward loop / pick detection (visual trail may be longer). */
  let loopSegmentStartIndex = 0;
  let isDrawing = false;
  let pickLocked = false;
  let autoCircleActive = false;
  let autoCircleFrame = 0;
  /** Parts tapped while an auto-circle is still running (FIFO). */
  let autoCircleQueue = [];
  /** @type {typeof cloudParts[0] | null} */
  let autoCircleTargetPart = null;

  function markPartTapped(part) {
    part?.anchor?.classList.add("is-tap-marked");
  }

  function clearPartTapMark(part) {
    part?.anchor?.classList.remove("is-tap-marked");
  }

  function clearPendingAutoCircleTapMarks() {
    if (autoCircleTargetPart) clearPartTapMark(autoCircleTargetPart);
    for (const p of autoCircleQueue) clearPartTapMark(p);
  }
  let partTapPending = null;
  const PART_TAP_MOVE_PX = 14;
  let ambientDecoyTimerId = null;
  let ambientDecoyCycleBusy = false;

  function getStagePoint(clientX, clientY) {
    const r = stage.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  function clampToStage(x, y, margin = 10) {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    return {
      x: Math.min(w - margin, Math.max(margin, x)),
      y: Math.min(h - margin, Math.max(margin, y)),
    };
  }

  function orient(a, b, c) {
    return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  }

  function onSegment(a, b, p) {
    return (
      Math.min(a.x, b.x) <= p.x &&
      p.x <= Math.max(a.x, b.x) &&
      Math.min(a.y, b.y) <= p.y &&
      p.y <= Math.max(a.y, b.y)
    );
  }

  function segmentsIntersect(p1, p2, p3, p4) {
    const o1 = orient(p1, p2, p3);
    const o2 = orient(p1, p2, p4);
    const o3 = orient(p3, p4, p1);
    const o4 = orient(p3, p4, p2);
    if (o1 === 0 && onSegment(p1, p2, p3)) return { x: p3.x, y: p3.y };
    if (o2 === 0 && onSegment(p1, p2, p4)) return { x: p4.x, y: p4.y };
    if (o3 === 0 && onSegment(p3, p4, p1)) return { x: p1.x, y: p1.y };
    if (o4 === 0 && onSegment(p3, p4, p2)) return { x: p2.x, y: p2.y };
    if (o1 > 0 !== o2 > 0 && o3 > 0 !== o4 > 0) {
      const A = p2.y - p1.y;
      const B = p1.x - p2.x;
      const C = A * p1.x + B * p1.y;
      const D = p4.y - p3.y;
      const E = p3.x - p4.x;
      const F = D * p3.x + E * p3.y;
      const det = A * E - D * B;
      if (Math.abs(det) < 1e-9) return null;
      return { x: (E * C - B * F) / det, y: (A * F - D * C) / det };
    }
    return null;
  }

  function detectLoopPickPoint(points, startIndex = 0) {
    const n = points.length;
    if (n - startIndex < 10) return null;
    const a = points[n - 2];
    const b = points[n - 1];
    for (let i = Math.max(startIndex, 0); i < n - 3; i++) {
      const hit = segmentsIntersect(a, b, points[i], points[i + 1]);
      if (!hit) continue;
      const loop = points.slice(i + 1);
      if (loop.length < 3) continue;
      let cx = 0;
      let cy = 0;
      for (const p of loop) {
        cx += p.x;
        cy += p.y;
      }
      return { x: cx / loop.length, y: cy / loop.length };
    }
    return null;
  }

  function hitTestCloud(cx, cy) {
    for (let zi = cloudParts.length - 1; zi >= 0; zi--) {
      const p = cloudParts[zi];
      if (
        cx >= p.left &&
        cx <= p.left + p.blockW &&
        cy >= p.top &&
        cy <= p.top + p.blockH
      ) {
        return p;
      }
    }
    return null;
  }

  function clearTrail() {
    pathPoints = [];
    loopSegmentStartIndex = 0;
    stopTrailFade();
    ctx.clearRect(0, 0, stage.clientWidth, stage.clientHeight);
  }

  function drawTrail() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    ctx.clearRect(0, 0, w, h);
    pruneFadedTrailHead();
    if (pathPoints.length < 2) {
      stopTrailFade();
      return;
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    let anyVisible = false;
    for (let i = 1; i < pathPoints.length; i++) {
      const p0 = pathPoints[i - 1];
      const p1 = pathPoints[i];
      const alpha = Math.min(trailAlphaAt(p0.t), trailAlphaAt(p1.t));
      if (alpha <= 0.02) continue;
      anyVisible = true;
      const speed = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      ctx.lineWidth = Math.min(11, Math.max(1.8, 1.8 + speed * 0.14));
      ctx.strokeStyle = `rgba(220, 20, 40, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    if (!anyVisible) {
      pathPoints = [];
      loopSegmentStartIndex = 0;
      stopTrailFade();
    }
  }

  function moveRose(x, y) {
    rose.style.left = `${x}px`;
    rose.style.top = `${y}px`;
  }

  function roseStageCenter() {
    const x = parseFloat(rose.style.left);
    const y = parseFloat(rose.style.top);
    if (Number.isFinite(x) && Number.isFinite(y)) return { x, y };
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    return { x: w * 0.5, y: h * 0.72 };
  }

  function cloudPartForAnchor(anchor) {
    if (!anchor) return null;
    return cloudParts.find((p) => p.anchor === anchor) || null;
  }

  function pathCumulativeLengths(path) {
    const lengths = [0];
    for (let i = 1; i < path.length; i++) {
      lengths.push(
        lengths[i - 1] + Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y)
      );
    }
    return lengths;
  }

  /** t in [0,1] along polyline by arc length. */
  function pointAlongPath(path, lengths, t) {
    if (!path.length) return { x: 0, y: 0 };
    if (t <= 0) return path[0];
    const total = lengths[lengths.length - 1];
    if (t >= 1 || total <= 0) return path[path.length - 1];
    const target = t * total;
    let i = 1;
    while (i < lengths.length && lengths[i] < target) i += 1;
    const a = path[i - 1];
    const b = path[i];
    const segStart = lengths[i - 1];
    const segLen = lengths[i] - segStart || 1;
    const u = (target - segStart) / segLen;
    return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
  }

  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  /** Chaikin-style smoothing on a closed or open index range (keeps endpoints). */
  function smoothPolylineRange(points, fromIdx, toIdx, passes = 2, mix = 0.42) {
    if (toIdx - fromIdx < 3) return;
    for (let pass = 0; pass < passes; pass++) {
      const slice = points.slice(fromIdx, toIdx + 1);
      const n = slice.length;
      for (let i = 1; i < n - 1; i++) {
        const mid = {
          x: (slice[i - 1].x + slice[i + 1].x) * 0.5,
          y: (slice[i - 1].y + slice[i + 1].y) * 0.5,
        };
        slice[i] = {
          x: slice[i].x + (mid.x - slice[i].x) * mix,
          y: slice[i].y + (mid.y - slice[i].y) * mix,
        };
      }
      for (let i = 0; i < n; i++) {
        points[fromIdx + i] = clampToStage(slice[i].x, slice[i].y);
      }
    }
  }

  /** Hand-drawn approach + elliptical loop around a lyric box (stage coords). */
  function buildAutoCirclePath(part, from) {
    const cx = part.left + part.blockW * 0.5;
    const cy = part.top + part.blockH * 0.5;
    const rx = part.blockW * 0.58 + 12;
    const ry = part.blockH * 0.58 + 12;
    const entryAngle = Math.atan2(from.y - cy, from.x - cx);
    const phase = hashSeed(`${part.text}:${gameExpectedLineIndex}`) * 0.0021;
    const entry = {
      x: cx + rx * Math.cos(entryAngle),
      y: cy + ry * Math.sin(entryAngle),
    };
    const out = [];
    const approachLen = Math.hypot(entry.x - from.x, entry.y - from.y);
    const approachSteps = Math.max(24, Math.min(80, Math.floor(approachLen / 1.8)));
    const perpX = -(entry.y - from.y) / (approachLen || 1);
    const perpY = (entry.x - from.x) / (approachLen || 1);
    for (let i = 0; i <= approachSteps; i++) {
      const t = i / approachSteps;
      const ease = t * t * (3 - 2 * t);
      const bow = Math.sin(t * Math.PI) * 2.4;
      const p = clampToStage(
        from.x + (entry.x - from.x) * ease + perpX * bow,
        from.y + (entry.y - from.y) * ease + perpY * bow * 0.55
      );
      out.push(p);
    }
    const loopStartIdx = out.length - 1;
    const turns = 1;
    const loopSteps = Math.max(
      120,
      Math.min(220, Math.floor(((rx + ry) * 0.5 * turns * Math.PI * 2) / 1.85))
    );
    for (let i = 0; i <= loopSteps; i++) {
      const u = i / loopSteps;
      const ang = entryAngle + u * turns * Math.PI * 2;
      const rPulse =
        1 +
        0.035 * Math.sin(ang * 2 + phase) +
        0.02 * Math.sin(ang * 3.1 + phase * 1.7);
      const driftX = Math.sin(ang * 2 + phase) * 1.1;
      const driftY = Math.cos(ang * 2 + phase * 0.9) * 0.85;
      const rxU = rx * rPulse;
      const ryU = ry * (rPulse * 0.97 + 0.03 * Math.sin(ang + phase));
      out.push(
        clampToStage(
          cx + driftX + rxU * Math.cos(ang),
          cy + driftY + ryU * Math.sin(ang)
        )
      );
    }
    smoothPolylineRange(out, loopStartIdx, out.length - 1, 1, 0.28);
    return out;
  }

  function stopCurrentAutoCircle(clearQueue = false) {
    if (autoCircleFrame) {
      cancelAnimationFrame(autoCircleFrame);
      autoCircleFrame = 0;
    }
    autoCircleActive = false;
    if (autoCircleTargetPart) clearPartTapMark(autoCircleTargetPart);
    autoCircleTargetPart = null;
    stage.classList.remove("is-drawing");
    if (clearQueue) {
      for (const p of autoCircleQueue) clearPartTapMark(p);
      autoCircleQueue = [];
    }
  }

  function cancelAutoCircleAnimation() {
    stopCurrentAutoCircle(true);
  }

  function autoCirclePendingCount() {
    return autoCircleQueue.length + (autoCircleActive ? 1 : 0);
  }

  function autoCircleSpeedFactor(pendingCount) {
    const n = Math.max(1, pendingCount);
    return Math.min(3.2, 1 + (n - 1) * 0.52);
  }

  function isPartQueuedOrActive(part) {
    if (!part?.anchor) return false;
    if (autoCircleTargetPart?.anchor === part.anchor) return true;
    return autoCircleQueue.some((p) => p.anchor === part.anchor);
  }

  function enqueueAutoCirclePart(part) {
    if (!part?.anchor?.isConnected) return false;
    if (!cloudParts.some((p) => p.anchor === part.anchor)) return false;
    if (isPartQueuedOrActive(part)) return false;
    markPartTapped(part);
    autoCircleQueue.push(part);
    return true;
  }

  function drainAutoCircleQueue() {
    while (autoCircleQueue.length) {
      if (pickLocked || isDrawing || autoCircleActive) return;
      const next = autoCircleQueue.shift();
      if (
        !next?.anchor?.isConnected ||
        !cloudParts.some((p) => p.anchor === next.anchor)
      ) {
        clearPartTapMark(next);
        continue;
      }
      runAutoCircleOnPart(next);
      return;
    }
  }

  function requestAutoCircleOnPart(part) {
    if (!part?.anchor?.isConnected) return;
    if (pickLocked || isDrawing || autoCircleActive) {
      enqueueAutoCirclePart(part);
      return;
    }
    markPartTapped(part);
    runAutoCircleOnPart(part);
  }

  function runAutoCircleOnPart(part) {
    if (!part || pickLocked || isDrawing) return;
    if (autoCircleFrame) {
      cancelAnimationFrame(autoCircleFrame);
      autoCircleFrame = 0;
    }
    autoCircleActive = true;
    autoCircleTargetPart = part;
    stage.classList.add("is-drawing");
    const from = roseStageCenter();
    const path = buildAutoCirclePath(part, from);
    const pathLengths = pathCumulativeLengths(path);
    const pathPixels = pathLengths[pathLengths.length - 1] || 1;
    const durationMs = Math.min(1320, 520 + pathPixels * 3.1);
    let prevArcT = 0;
    let arcProgress = 0;
    let lastTickAt = performance.now();

    const tick = (now) => {
      if (!autoCircleActive || pickLocked) {
        stopCurrentAutoCircle(false);
        return;
      }
      const dt = Math.max(0, now - lastTickAt);
      lastTickAt = now;
      const speed = autoCircleSpeedFactor(autoCirclePendingCount());
      arcProgress = Math.min(1, arcProgress + (dt / durationMs) * speed);
      const eased = easeInOutSine(arcProgress);
      const arcSpan = (eased - prevArcT) * pathPixels;
      const subSteps = Math.max(1, Math.ceil(arcSpan / 1.75));
      for (let k = 1; k <= subSteps; k++) {
        const t = prevArcT + ((eased - prevArcT) * k) / subSteps;
        const pt = pointAlongPath(path, pathLengths, t);
        appendPathPoint(pt.x, pt.y, { detectPick: false });
      }
      prevArcT = eased;
      const p = pointAlongPath(path, pathLengths, eased);
      moveRose(p.x, p.y);
      if (arcProgress >= 1) {
        autoCircleFrame = 0;
        autoCircleActive = false;
        autoCircleTargetPart = null;
        stage.classList.remove("is-drawing");
        resolvePick(part);
        return;
      }
      autoCircleFrame = requestAnimationFrame(tick);
    };
    autoCircleFrame = requestAnimationFrame(tick);
  }

  const PICK_FADE_MS = 480;
  const DECOY_AMBIENT_MIN_MS = 5000;
  const DECOY_AMBIENT_MAX_MS = 8000;
  const TRAIL_FADE_MS = 4200;
  const TRAIL_ALPHA_MAX = 0.88;
  let trailAnimFrame = 0;

  function trailAlphaAt(timeMs) {
    const age = performance.now() - timeMs;
    if (age >= TRAIL_FADE_MS) return 0;
    return TRAIL_ALPHA_MAX * (1 - age / TRAIL_FADE_MS);
  }

  function pruneFadedTrailHead() {
    while (pathPoints.length > 1 && trailAlphaAt(pathPoints[1].t) <= 0) {
      pathPoints.shift();
      loopSegmentStartIndex = Math.max(0, loopSegmentStartIndex - 1);
    }
  }

  function scheduleTrailFade() {
    if (trailAnimFrame) return;
    trailAnimFrame = requestAnimationFrame(trailFadeTick);
  }

  function stopTrailFade() {
    if (!trailAnimFrame) return;
    cancelAnimationFrame(trailAnimFrame);
    trailAnimFrame = 0;
  }

  function trailFadeTick() {
    trailAnimFrame = 0;
    if (pathPoints.length < 2) return;
    drawTrail();
    if (pathPoints.length >= 2) scheduleTrailFade();
  }

  const FLY_TO_ASSEMBLY_MS = 520;

  function flyCorrectPickToAssembly(anchor, onComplete) {
    cloudParts = cloudParts.filter((p) => p.anchor !== anchor);
    anchor.classList.remove("is-spawn-in", "is-spawn-visible", "is-picked-wrong", "is-tap-marked");
    const start = anchor.getBoundingClientRect();
    const targetLine = assemblyEl.lastElementChild;
    const target = targetLine
      ? targetLine.getBoundingClientRect()
      : assemblyEl.getBoundingClientRect();
    const startCx = start.left + start.width / 2;
    const startCy = start.top + start.height / 2;
    const targetCx = target.left + target.width / 2;
    const targetCy = target.top + target.height / 2;

    anchor.classList.add("is-fly-overlay", "is-flying-to-assembly");
    anchor.style.left = `${start.left}px`;
    anchor.style.top = `${start.top}px`;
    anchor.style.width = `${start.width}px`;
    anchor.style.height = `${start.height}px`;
    drawLayer.insertBefore(anchor, drawLayer.firstChild);

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      anchor.removeEventListener("transitionend", onTransitionEnd);
      anchor.remove();
      onComplete?.();
    };
    const onTransitionEnd = (e) => {
      if (e.target !== anchor || e.propertyName !== "transform") return;
      finish();
    };
    anchor.addEventListener("transitionend", onTransitionEnd);

    const flyDx = targetCx - startCx;
    const flyDy = targetCy - startCy;
    anchor.style.setProperty("--fly-dx", "0px");
    anchor.style.setProperty("--fly-dy", "0px");
    void anchor.offsetWidth;
    requestAnimationFrame(() => {
      anchor.style.setProperty("--fly-dx", `${flyDx}px`);
      anchor.style.setProperty("--fly-dy", `${flyDy}px`);
      anchor.classList.add("is-fly-run");
      window.setTimeout(finish, FLY_TO_ASSEMBLY_MS + 80);
    });
  }

  function revealAssembledLine(fullLine) {
    gameAssembledLines.push(fullLine);
    currentLineAssemblyParts.length = 0;
    renderAssembly();
    const slot = assemblyEl.lastElementChild;
    if (slot) {
      slot.classList.remove("is-empty");
      slot.classList.add("is-reveal-pop");
    }
  }

  /** Drop any leftover boxes for a line that just finished (correct picks already flew off). */
  function removeCloudPartsForSongLine(songLineIndex) {
    for (const p of cloudParts.filter((cp) => cp.lineIndex === songLineIndex)) {
      finishPickRemoval(p);
    }
  }

  /** After the last phrase of a line: advance play state without re-randomizing the cloud. */
  function continueCloudAfterLineComplete(completedSongLineIndex) {
    cancelAutoCircleAnimation();
    removeCloudPartsForSongLine(completedSongLineIndex);
    ensureExpectedOnCloud();
    ensureCurrentLinePartsOnCloud();
  }

  function isCorrectPick(hit) {
    const entry = activeLineEntry();
    if (hit.text !== expectedPartText()) return false;
    if (!lineUsesMultiPartPlay()) return hit.lineIndex === entry.lineIndex;
    return (
      hit.lineIndex === entry.lineIndex &&
      hit.partIndex === gameExpectedPartIndex
    );
  }

  function resolvePick(hit) {
    if (!hit || pickLocked) return;
    if (!cloudParts.some((p) => p.anchor === hit.anchor)) return;
    pickLocked = true;
    loopSegmentStartIndex = pathPoints.length;

    const correct = isCorrectPick(hit);
    const lineEntry = activeLineEntry();
    const lineParts = partsForEntry(lineEntry);
    const lineCompleteOnThisPick =
      correct &&
      (!lineUsesMultiPartPlay() ||
        (lineParts.length > 0 &&
          gameExpectedPartIndex === lineParts.length - 1));

    const afterPickFade = (wasCorrect) => {
      if (!wasCorrect) finishPickRemoval(hit);
      if (wasCorrect) {
        if (lineUsesMultiPartPlay() && !lineCompleteOnThisPick) {
          gameExpectedPartIndex += 1;
          ensureExpectedOnCloud();
          ensureCurrentLinePartsOnCloud();
        } else {
          const completedSongLineIndex = lineEntry.lineIndex;
          gameExpectedLineIndex += 1;
          gameExpectedPartIndex = 0;
          if (lineUsesMultiPartPlay()) {
            continueCloudAfterLineComplete(completedSongLineIndex);
          } else {
            ensureExpectedOnCloud();
            spawnCloudReplacementDecoy("repl-correct");
          }
        }
      } else {
        spawnCloudReplacementDecoy("repl-wrong", hit.anchor);
        if (lineUsesMultiPartPlay()) ensureCurrentLinePartsOnCloud();
      }
      topUpCloudToMaxBoxes();
      pickLocked = false;
      ensureAmbientDecoyRotation();
      drawTrail();
      scheduleTrailFade();
      drainAutoCircleQueue();
    };

    if (correct) {
      const bonus = Math.floor(countdownRemaining * 10);
      sessionScore += 100 + bonus;
      countdownRemaining = 10.0;
      const assembledFull = lineEntry.full;
      updateHud();
      flyCorrectPickToAssembly(hit.anchor, () => {
        if (lineUsesMultiPartPlay()) {
          currentLineAssemblyParts.push(hit.text);
          if (lineCompleteOnThisPick) {
            revealAssembledLine(assembledFull);
          } else {
            renderAssembly();
            const slot = assemblyEl.lastElementChild;
            if (slot) {
              slot.classList.remove("is-empty");
              slot.classList.add("is-reveal-pop");
            }
          }
        } else {
          revealAssembledLine(assembledFull);
        }
        updateHud();
        afterPickFade(true);
      });
    } else {
      countdownRemaining = Math.max(0, countdownRemaining - 3);
      updateHud();
      hit.anchor.classList.add("is-picked-wrong");
      window.setTimeout(() => afterPickFade(false), PICK_FADE_MS);
    }
  }

  function appendPathPoint(x, y, opts = {}) {
    const detectPick = opts.detectPick !== false;
    const minDist = opts.minDist ?? (autoCircleActive ? 0.65 : 2.5);
    const last = pathPoints[pathPoints.length - 1];
    if (last && Math.hypot(x - last.x, y - last.y) < minDist) return;
    pathPoints.push({ x, y, t: performance.now() });
    drawTrail();
    scheduleTrailFade();
    if (!detectPick || autoCircleActive) return;
    const pickPt = detectLoopPickPoint(pathPoints, loopSegmentStartIndex);
    if (!pickPt) return;
    const hit = hitTestCloud(pickPt.x, pickPt.y);
    if (hit) resolvePick(hit);
  }

  function onPartPointerDown(e) {
    if (!PLAY_GAME || ALL_LEVELS_PREVIEW) return;
    if (e.button !== 0 && e.pointerType === "mouse") return;
    const anchor = e.target.closest?.(".lyric-part-anchor");
    if (!anchor || anchor.classList.contains("is-fly-overlay")) return;
    const part = cloudPartForAnchor(anchor);
    if (!part) return;
    e.stopPropagation();
    partTapPending = {
      pointerId: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      part,
      anchor,
    };
    anchor.setPointerCapture?.(e.pointerId);
  }

  function finishPartTap(e) {
    if (!partTapPending || partTapPending.pointerId !== e.pointerId) return;
    const { x, y, part, anchor } = partTapPending;
    partTapPending = null;
    if (anchor.hasPointerCapture?.(e.pointerId)) anchor.releasePointerCapture(e.pointerId);
    if (Math.hypot(e.clientX - x, e.clientY - y) > PART_TAP_MOVE_PX) return;
    requestAutoCircleOnPart(part);
  }

  function onPartPointerUp(e) {
    finishPartTap(e);
  }

  function onPartPointerCancel(e) {
    if (partTapPending?.pointerId === e.pointerId) partTapPending = null;
  }

  function onPointerDown(e) {
    if (!PLAY_GAME || ALL_LEVELS_PREVIEW || pickLocked || autoCircleActive) return;
    if (e.target.closest?.(".lyric-part-anchor")) return;
    if (e.button !== 0 && e.pointerType === "mouse") return;
    cancelAutoCircleAnimation();
    stage.setPointerCapture(e.pointerId);
    isDrawing = true;
    clearTrail();
    stage.classList.add("is-drawing");
    const raw = getStagePoint(e.clientX, e.clientY);
    const p = clampToStage(raw.x, raw.y);
    moveRose(p.x, p.y);
    pathPoints.push({ ...p, t: performance.now() });
    drawTrail();
    scheduleTrailFade();
  }

  function onPointerMove(e) {
    if (!isDrawing) return;
    const raw = getStagePoint(e.clientX, e.clientY);
    const p = clampToStage(raw.x, raw.y);
    moveRose(p.x, p.y);
    appendPathPoint(p.x, p.y);
  }

  function onPointerEnd(e) {
    if (!isDrawing) return;
    isDrawing = false;
    stage.classList.remove("is-drawing");
    if (stage.hasPointerCapture?.(e.pointerId)) stage.releasePointerCapture(e.pointerId);
    if (!pickLocked && !autoCircleActive) clearTrail();
    drainAutoCircleQueue();
  }

  if (PLAY_GAME) {
    partsRoot.addEventListener("pointerdown", onPartPointerDown);
    partsRoot.addEventListener("pointerup", onPartPointerUp);
    partsRoot.addEventListener("pointercancel", onPartPointerCancel);
    stage.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("pointermove", onPointerMove);
    stage.addEventListener("pointerup", onPointerEnd);
    stage.addEventListener("pointercancel", onPointerEnd);
    setInterval(() => {
      if (!PLAY_GAME || pickLocked) return;
      countdownRemaining = Math.max(0, countdownRemaining - 0.1);
      updateHud();
    }, 100);
  }

  function layoutParts() {
    const frameW = stage.clientWidth;
    const frameH = stage.clientHeight;
    partsRoot.innerHTML = "";
    pickLocked = false;
    isDrawing = false;
    cancelAutoCircleAnimation();
    partTapPending = null;
    clearTrail();
    document.body.classList.toggle("is-all-levels-preview", ALL_LEVELS_PREVIEW);
    document.body.classList.toggle("is-play-game", PLAY_GAME && !ALL_LEVELS_PREVIEW);
    rose.style.display = ALL_LEVELS_PREVIEW ? "none" : "";

    let lastAnchor = null;
    if (ALL_LEVELS_PREVIEW) {
      lastAnchor = layoutAllLevelsPreview(frameW, frameH);
    } else if (PLAY_GAME) {
      lastAnchor = layoutCloudPlayfield(frameW, frameH);
    } else {
      const gap = 20;
      const lineEntry = activeLineEntry();
      const refCellPx = referenceCellPxForLine(lineEntry, frameW, frameH);
      lastAnchor = layoutSingleLevel(
        DISPLAY_PARTS(),
        frameW,
        frameH,
        refCellPx,
        gap,
        ACTIVE_GAME_LEVEL
      );
    }

    resizeCanvas();
    if (PLAY_GAME && !ALL_LEVELS_PREVIEW) {
      moveRose(frameW * 0.5, frameH * 0.72);
    } else if (lastAnchor) {
      rose.style.left = `${lastAnchor.left + lastAnchor.blockW * 0.72}px`;
      rose.style.top = `${lastAnchor.top + lastAnchor.blockH * 0.55}px`;
    }
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (pathPoints.length >= 2) {
      drawTrail();
      scheduleTrailFade();
    }
  }

  layoutParts();
  window.addEventListener("resize", layoutParts);
})();
</script>
</body>
